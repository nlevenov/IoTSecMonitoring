name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Tests (root, so live capture and privilege dropping are exercised)
        run: sudo -E env "PATH=$PATH" python -m pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis (bandit)
        run: bandit -q -r src
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t iotsec:ci .
      - name: Container runs as an unprivileged user
        run: test "$(docker run --rm iotsec:ci id -u)" = "10001"
      - name: Detection works inside the image
        run: |
          docker run --rm -e IOTSEC_DATABASE=/tmp/lab.db iotsec:ci sh -c \
            "iotsec -c config/lab.yaml simulate -o /tmp/lab.pcap && \
             iotsec -c config/lab.yaml evaluate --pcap /tmp/lab.pcap --backend tshark" \
            | tee eval.txt
          grep -q "attacks detected        8/8" eval.txt
      - name: Dashboard refuses to start without a password
        run: |
          if docker run --rm iotsec:ci iotsec dashboard; then exit 1; fi
