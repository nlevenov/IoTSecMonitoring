[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iotsec"
version = "1.0.0"
description = "IoT security monitoring: device discovery, traffic analysis, anomaly detection and alerting for home and lab networks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikola Levenov" }]
requires-python = ">=3.10"
keywords = ["iot", "network-security", "intrusion-detection", "anomaly-detection", "scapy", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "scapy>=2.5",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.40",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
iotsec = "iotsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iotsec = ["data/*.csv", "dashboard/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["iotsec"]
known-local-folder = ["helpers", "conftest"]

[tool.bandit]
exclude_dirs = ["tests"]
