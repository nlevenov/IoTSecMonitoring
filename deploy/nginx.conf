# TLS reverse proxy in front of the dashboard (which listens on 127.0.0.1:8501).
# Set IOTSEC_ALLOWED_HOSTS / dashboard.allowed_hosts to the server_name below.
server {
    listen 443 ssl;
    http2 on;
    server_name iot-monitor.example.internal;

    ssl_certificate     /etc/ssl/certs/iot-monitor.crt;
    ssl_certificate_key /etc/ssl/private/iot-monitor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # optional second factor: client certificates or an allow-list
    # allow 192.168.1.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name iot-monitor.example.internal;
    return 301 https://$host$request_uri;
}
